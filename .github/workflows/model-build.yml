# Build, sign, verify and publish the CrustAdvisor model.
#
# What the laptop gate trusts is decided here: the model is signed with
# OpenSSF Model Signing by this workflow's OIDC identity, and admit/policy.hjson
# pins exactly that identity. The same policy is evaluated at the end of this
# job, so a model that would be refused on stage never gets published.
name: model-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "OCI tag to publish (default: short commit sha)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "model/**"
      - "admit/**"
      - ".github/workflows/model-build.yml"

permissions:
  contents: read
  id-token: write      # sigstore keyless signing
  packages: write      # ghcr.io
  attestations: write  # GitHub attestation store (bnd push github)

env:
  IMAGE: ghcr.io/${{ github.repository }}/model
  LLAMA_CPP_VERSION: v0.9.0

jobs:
  build:
    name: build, sign, gate, publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        # The snapshot (~8 GB), the f16 GGUF (~8 GB) and the quantized model
        # (~2.5 GB) do not fit next to the runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6

      - name: Install bnd
        # The Carabiner installers verify the release provenance before
        # putting the binary on PATH. bnd is used by publish.sh to push the
        # signed bundles to the attestation store.
        uses: carabiner-dev/actions/install/bnd@63d43b57262e65927864c8f7ca0a6a8efe06acc0 # v1.3.1
        with:
          version: v0.4.7

      - name: Install ampel
        # provenance.sh downloads slsa-attester at its pinned release and
        # verifies it with ampel against the provenance slsa-framework/actions
        # signed for it, before trusting it to write ours. (The generic
        # Carabiner installer cannot be used for the attester yet: its smoke
        # test runs `<tool> version`, which the attester does not have.)
        uses: carabiner-dev/actions/install/ampel@63d43b57262e65927864c8f7ca0a6a8efe06acc0 # v1.3.1
        with:
          version: v1.5.0

      - name: Build the model
        # Pulls the pinned snapshot, enriches, converts, quantizes, writes the
        # statements. llama-quantize is built from the pinned llama.cpp clone.
        id: build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          model/build.sh
          rm -rf build/hf build/enriched
          df -h /
          cat build/build-info.json
          echo "oms-digest=sha256:$(python3 -c 'import json; print(json.load(open("build/build-info.json"))["output"]["oms_sha256"])')" >> "$GITHUB_OUTPUT"

      - name: Sign the model (OpenSSF Model Signing)
        # model_signing signs the GGUF with the workflow's OIDC token
        # (ambient credentials): the signing identity is this workflow.
        run: model/sign.sh --model-only

      - name: Write and sign the provenance (slsa-attester)
        # provenance.sh hands the build's facts (the Hugging Face snapshot at
        # its revision with every file's digest, llama.cpp, this commit, the
        # parameters and timings) to slsa-attester, which writes the predicate,
        # binds it to the model's OMS digest, names this workflow as the
        # builder and signs it with the workflow's OIDC identity. The unsigned
        # provenance the build wrote for laptop rehearsals is replaced.
        env:
          SIGN: "1"
        run: |
          rm -f build/attestations/provenance.intoto.json
          model/provenance.sh

      - name: Sign the ML-BOM
        uses: carabiner-dev/actions/bnd/sign@63d43b57262e65927864c8f7ca0a6a8efe06acc0 # v1.3.1
        with:
          json-path: build/attestations/sbom.cdx.intoto.json
          output: build/attestations/attestations.jsonl
          bnd-version: v0.4.7

      - name: Gate the model
        # The same policy the laptop's model-admit runs, in stage mode: only
        # the signed bundles in build/attestations count and the signer must
        # be this workflow. The subject is the model's OMS root digest, what
        # `ampel verify model` computes. The verdict is written as a signed
        # SLSA Verification Summary Attestation and rendered in the job summary.
        uses: carabiner-dev/actions/ampel/verify@63d43b57262e65927864c8f7ca0a6a8efe06acc0 # v1.3.1
        with:
          ampel-version: v1.5.0
          policy: admit/policy.hjson
          subject: ${{ steps.build.outputs.oms-digest }}
          collector: fs:build/attestations
          attest: "true"
          attest-format: vsa
          results-path: build/vsa.intoto.json
          results: report
          fail: "true"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
          PUSH_LATEST: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '1' || '0' }}
        run: |
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          export TAG
          model/publish.sh

      - name: Upload the receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crustadvisor-model-attestations
          path: |
            build/build-info.json
            build/attestations/
            build/vsa.intoto.json
          if-no-files-found: error
