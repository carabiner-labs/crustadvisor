# SLSA source provenance for every push to main.
#
# The reusable workflow from slsa-framework/actions runs the SLSA source
# tool on the pushed commit: it records which controls protected the
# branch, signs source provenance and a verification summary with its own
# workflow identity, and stores both in the commit's git note. That note is
# what admit/source-admit (and the app build) require before a commit is
# built. A commit that did not come through here has no note.
name: slsa-source

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  source-provenance:
    permissions:
      contents: write   # store the attestations in the repository's git notes
      id-token: write   # sigstore keyless signing
    # The maintained reusable workflow lives in slsa-framework/actions (the
    # one in slsa-framework/source-actions is the legacy copy: it downloads
    # the tool's provenance under its pre-v0.7.2 name and verifies the binary
    # with an ampel too old for carabiner-dev/policies as regenerated on
    # 2026-11-05).
    uses: slsa-framework/actions/.github/workflows/compute_slsa_source.yml@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
    with:
      version: v0.7.2
